<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#15191E" />
    <title>PaceLab · Your AI coaching staff</title>
    <meta name="description" content="Upload your runs, pick a race, and watch a council of AI coaches build your plan." />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%231D2229'/%3E%3Cpath d='M7 21 L13 14 L17 18 L25 9' fill='none' stroke='%23D2F53C' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Big+Shoulders:wght@700;800&display=swap" rel="stylesheet">
  </head>
  <body>
    <!-- Logo mark and Start illustration, inlined so the page carries its own images.
         Colors come from the theme variables in src/index.css. -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
      <symbol id="pl-logo" viewBox="0 0 32 32">
        <rect width="32" height="32" rx="9" style="fill: var(--surface-2)" />
        <path d="M7 21 L13 14 L17 18 L25 9" style="fill: none; stroke: var(--brand)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
        <circle cx="25" cy="9" r="2.6" style="fill: var(--ink)" />
      </symbol>
      <!-- Runner on a night road for the Start tab -->
      <symbol id="pl-runner" viewBox="0 0 120 120">
        <circle cx="60" cy="60" r="58" style="fill: var(--surface-2)" />
        <path d="M14 92 Q60 78 106 92" style="fill: none; stroke: var(--axis)" stroke-width="4" stroke-linecap="round" stroke-dasharray="6 7" />
        <circle cx="70" cy="28" r="9" style="fill: var(--ink)" />
        <g style="fill: none; stroke: var(--ink)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M66 40 L56 62" />
          <path d="M64 44 L78 52 L86 46" />
          <path d="M64 44 L50 48 L42 58" />
          <path d="M56 62 L70 72 L66 90" />
          <path d="M56 62 L46 76 L32 76" />
        </g>
        <g style="stroke: var(--ink-2)" stroke-width="3" stroke-linecap="round">
          <path d="M18 50 H32" /><path d="M12 62 H28" /><path d="M20 74 H30" />
        </g>
      </symbol>
    </svg>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
